{{ define "main" }}
<article class="gallery">
  <header>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </header>

  <div class="gallery-grid">
    {{ range hugo.Data.gallery.items }}
      {{ $img := resources.Get (printf "gallery/%s" .file) }}
      {{ if $img }}
        <figure class="gallery-item">
          <img src="{{ $img.RelPermalink }}" alt="{{ .alt }}" loading="lazy">
          {{ with .caption }}<figcaption>{{ . }}</figcaption>{{ end }}
        </figure>
      {{ else }}
        <p style="color:red">Missing: assets/gallery/{{ .file }}</p>
      {{ end }}
    {{ end }}
  </div>
</article>

<style>
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 8px;
    margin-top: 1.5rem;
  }
  .gallery-item { margin: 0; }
  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
  }
  .gallery-item figcaption {
    margin-top: 0.25rem;
    font-size: 0.875rem;
    opacity: 0.7;
  }
</style>
{{ end }}
